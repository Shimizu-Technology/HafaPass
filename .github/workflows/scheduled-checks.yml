name: Scheduled checks

# Catches what PR CI can't: a new advisory against an unchanged lockfile, and
# production drifting from main (an API change merged but never deployed, a
# Netlify publish that failed or stayed locked, or readiness failing).
# GitHub emails the workflow's last editor when a scheduled run fails.
on:
  schedule:
    # 21:00 UTC is 7:00 AM Guam time.
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependencies / Security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: "3.3.13"
          bundler-cache: true
          working-directory: hafapass_api
      - name: Bundler Audit
        working-directory: hafapass_api
        run: bundle exec bundler-audit check --update
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hafapass_frontend/package-lock.json
      - name: Production npm audit
        working-directory: hafapass_frontend
        run: npm run audit:prod

  production-drift:
    name: Production / Matches main and is ready
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://hafapass.shimizu-technology.com
      API_URL: https://hafapass-api.onrender.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Compare live revisions with main
        run: scripts/check_production_drift.sh
