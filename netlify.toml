# Netlify entry point for this monorepo.
#
# The site builds from the repository root (no base directory in the Netlify
# UI). Netlify only reads a netlify.toml from the base directory or the root,
# so the frontend's own hafapass_frontend/netlify.toml and its edge functions
# were never picked up and share previews never deployed.
#
# Setting build.base here makes Netlify run a second configuration pass from
# hafapass_frontend/: it then loads hafapass_frontend/netlify.toml as the
# effective configuration and finds edge functions in
# hafapass_frontend/netlify/edge-functions/. File-based settings override the
# UI build settings, so the UI command/publish values no longer apply.
#
# That second pass is Netlify's default ("baseRelDir"). Only sites on the legacy
# single-pass mode use the values below; there, paths resolve from the
# repository root and the command runs in the base directory. They point at the
# same build output and edge functions as hafapass_frontend/netlify.toml.
# Verified with @netlify/config in both modes. Keep the two files in step.
# Redirects and the SPA fallback live in hafapass_frontend/public/_redirects.
[build]
  base = "hafapass_frontend"
  command = "npm run build"
  publish = "hafapass_frontend/dist"
  edge_functions = "hafapass_frontend/netlify/edge-functions"

# Legacy single-pass builds use this root configuration.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Permissions-Policy = 'camera=(self), payment=(self "https://js.stripe.com"), microphone=(), geolocation=()'
    # Report-only: violations show in the browser console and block nothing.
    # Clerk's bot protection loads from *.protect.clerk.com and probes on extra ports.
    # Tighten (and enforce) once a release shows no unexpected reports.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://*.js.stripe.com https://clerk.hafapass.shimizu-technology.com https://*.clerk.accounts.dev https://cdn.protect.clerk.com https://*.client.protect.clerk.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.clerk.com https://hafapass-staging-assets-20261010-01a11d81.s3.ap-southeast-2.amazonaws.com https://*.stripe.com; font-src 'self' data:; connect-src 'self' https://hafapass-api.onrender.com https://api.stripe.com https://clerk.hafapass.shimizu-technology.com https://*.clerk.accounts.dev https://*.client.protect.clerk.com:* https://*.sentry.io; frame-src https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://challenges.cloudflare.com https://www.youtube-nocookie.com https://player.vimeo.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/events/*/preview"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# Vite fingerprints every file under /assets, so a URL never changes content.
# Stripe Elements loads the brand font files into its js.stripe.com iframe.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "https://js.stripe.com"

# Pages whose URL carries a ticket credential, order access, transfer, invitation
# or unsubscribe token: keep them out of search results and never send the URL
# as a referrer. Each path is listed exactly; a section root and its subpaths
# are separate.
[[headers]]
  for = "/tickets/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/orders/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/ticket-transfers/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/unsubscribe/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/organization-invitations/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/platform-invitations/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# Personal, account, sign-in, checkout and staff pages: out of search results,
# but they keep the site-wide referrer policy. Clerk's bot protection
# (Cloudflare Turnstile) and Stripe's 3-D Secure frames may check the
# referring origin, and these URLs carry no credentials.
[[headers]]
  for = "/checkout/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/my-tickets"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/saved"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/support"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/support/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/privacy"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/privacy/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/account/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/sign-in"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/sign-in/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/sign-up"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/sign-up/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
