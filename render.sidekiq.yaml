  dockerContext: .
  autoDeployTrigger: 'off'
  numInstances: 1
  maxShutdownDelaySeconds: 120
  dockerCommand: sh -c 'export GIT_SHA="$RENDER_GIT_COMMIT"; exec bundle exec rails runner script/commerce_clock.rb'
  plan: 0.5c-512mb
  envVars:
  - fromGroup: hafapass-production-runtime
  - key: REDIS_URL
