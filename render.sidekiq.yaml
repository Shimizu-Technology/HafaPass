  - key: FRONTEND_URL
    fromService:
      type: web
      name: hafapass-api
      envVarKey: FRONTEND_URL
  - key: PUBLIC_WEB_URL
    fromService:
      type: web
      name: hafapass-api
      envVarKey: PUBLIC_WEB_URL
  - key: SENTRY_DSN
    fromService:
      type: web
      name: hafapass-api
      envVarKey: SENTRY_DSN
  - key: AWS_ACCESS_KEY_ID
    fromService:
      type: web
      name: hafapass-api
      envVarKey: AWS_ACCESS_KEY_ID
  - key: AWS_SECRET_ACCESS_KEY
    fromService:
      type: web
      name: hafapass-api
      envVarKey: AWS_SECRET_ACCESS_KEY
  - key: AWS_BUCKET
    fromService:
      type: web
      name: hafapass-api
