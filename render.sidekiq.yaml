- type: keyvalue
  name: hafapass-production-queue
  region: singapore
  plan: 256mb
  maxmemoryPolicy: noeviction
  persistenceMode: journal-snapshot
  ipAllowList: []
envVarGroups:
- name: hafapass-production-runtime
  envVars:
  - key: RAILS_ENV
    value: production
  - key: HAFAPASS_LAUNCH_SCOPE
    value: general_admission
  - key: HAFAPASS_PROVIDER_REHEARSAL
    value: 'false'
  - key: ENABLE_FIRST_USER_ADMIN_BOOTSTRAP
    value: 'false'
  - key: RAILS_MAX_THREADS
    value: '3'
  - key: SIDEKIQ_CONCURRENCY
    value: '3'
  - key: DB_POOL
    value: '5'
  - key: PUBLIC_API_URL
    value: https://hafapass-api.onrender.com
