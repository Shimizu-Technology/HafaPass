  - key: DATABASE_URL
    fromService:
      type: web
      name: hafapass-api
      envVarKey: DATABASE_URL
  - key: SECRET_KEY_BASE
    fromService:
      type: web
      name: hafapass-api
      envVarKey: SECRET_KEY_BASE
  - key: CLERK_SECRET_KEY
    fromService:
      type: web
      name: hafapass-api
      envVarKey: CLERK_SECRET_KEY
  - key: CLERK_PUBLISHABLE_KEY
    fromService:
