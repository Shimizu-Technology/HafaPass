# Never-fulfilled reader register (docs/design/never-fulfilled-captures.md
# §8.1, §8.10.12). Every file under app/ that reads order or payment money
# states (it matches partially_refunded, :refunded, "refunded" or
# excluding_test_payments) is listed with how it treats a classified
# (never-fulfilled) capture. spec/config/never_fulfilled_readers_spec.rb
# fails on an unlisted matching file, a listed file that no longer exists,
# and a classified_rule reader that stops naming the shared rule.
#
# Treatments:
#   classified_rule  applies the classification by table (Order.
#                    excluding_never_fulfilled, Refund/Dispute.on_sale,
#                    Commerce::ClassifiedOrganizerView,
#                    Commerce::ClassifiedPaymentFinance, UnfulfilledCapture);
#   shared_reader    money comes only through a classified_rule reader
#                    (Settlements::Calculator, Commerce::LedgerTotals, ...);
#   writer_boundary  an A1 lifecycle, refund or cancellation writer whose
#                    boundary is enforced by the database fences (§4.2, §6.2);
#   platform_only    platform-wide money out or in, not organizer figures;
#   not_money        status display, tickets, messaging or audit wording.
#
# Payout entry points (creation, held release, submission, paid) are not
# listed: the database enforces them for every writer (PAYOUT_ENTRY_SQL;
# spec/services/payout_entry_guard_spec.rb).
readers:
  app/controllers/api/v1/admin/dashboard_controller.rb: { treatment: shared_reader, note: "Commerce::LedgerTotals" }
  app/controllers/api/v1/admin/events_controller.rb: { treatment: shared_reader, note: "Commerce::LedgerTotals; cancellation refund preview through EventCancellationRefunds" }
  app/controllers/api/v1/admin/marketplace_controller.rb: { treatment: classified_rule, note: "attribution gross leaves never_fulfilled_at orders out" }
  app/controllers/api/v1/me/event_referrals_controller.rb: { treatment: not_money, note: "buyer's own referral status" }
  app/controllers/api/v1/me/orders_controller.rb: { treatment: not_money, note: "buyer's own order status" }
  app/controllers/api/v1/orders_controller.rb: { treatment: not_money, note: "buyer order status" }
  app/controllers/api/v1/organizer/box_office_card_sales_controller.rb: { treatment: not_money, note: "door card order status" }
  app/controllers/api/v1/organizer/box_office_controller.rb: { treatment: not_money, note: "box office order status" }
  app/controllers/api/v1/organizer/events_controller.rb: { treatment: classified_rule, note: "event stats" }
  app/controllers/api/v1/organizer/orders_controller.rb: { treatment: not_money, note: "order list status and refund actions (RefundCreator fence)" }
  app/controllers/concerns/cancellation_refund_actions.rb: { treatment: writer_boundary, note: "EventCancellationRefunds" }
  app/jobs/event_cancellation_refund_job.rb: { treatment: writer_boundary, note: "EventCancellationRefunds" }
  app/jobs/sweep_pending_stripe_fees_job.rb: { treatment: writer_boundary, note: "fee evidence requests; StripeProcessingFees owns attribution" }
  app/models/audience_mailing.rb: { treatment: not_money, note: "audience segment by order status" }
  app/models/event_cancellation_refund_run.rb: { treatment: writer_boundary, note: "cancellation run; automatic PayoutHoldRelease is fenced (M-09)" }
  app/models/order.rb: { treatment: classified_rule, note: "defines excluding_never_fulfilled and sale_refunds" }
  app/models/payment.rb: { treatment: classified_rule, note: "live agent capture scopes" }
  app/services/admin_payout_due_list.rb: { treatment: shared_reader, note: "lists events with sales; amounts from Settlements::Calculator and OrganizationPayoutBalance" }
  app/services/admissions/counts.rb: { treatment: not_money, note: "admission counts by ticket" }
