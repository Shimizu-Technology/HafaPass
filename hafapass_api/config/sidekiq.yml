# Sidekiq configuration
# https://github.com/sidekiq/sidekiq/wiki/Advanced-Options

<% require_relative "runtime_configuration" %>
:concurrency: <%= RuntimeConfiguration.worker_concurrency %>

:queues:
  - [emails, 3]      # Higher priority for emails
  - [default, 2]     # Standard priority
  - [low, 1]         # Lower priority background tasks

# Capacity is explicitly configured per deployed service. The default fits a
# small initial worker and the default five-connection Active Record pool.
