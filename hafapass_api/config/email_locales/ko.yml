    single: "티켓이 PDF로도 첨부되어 있어 인터넷 연결 없이도 입장 시 확인할 수 있습니다."
    all: "티켓 %{count}장 모두 PDF로도 첨부되어 있어 인터넷 연결 없이도 입장 시 확인할 수 있습니다."
  ticket:
    subject: "내 티켓 - %{event}"
    heading: "내 티켓"
    view: "내 티켓 보기"
    entry_instructions: "입장 시 QR Code를 제시해 주세요."
