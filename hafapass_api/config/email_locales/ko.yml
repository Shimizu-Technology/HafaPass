# Buyer email copy in English (the source language). The other files in this
# directory are generated from this one by the `gt` CLI; see docs/TRANSLATIONS.md.
# Keep %{placeholders} unchanged. Text only: links and formatting are added by
# EmailService, and every value is HTML-escaped.
emails:
  footer: "제공: HåfaPass · Shimizu Technology"
  my_tickets: "내 티켓"
  formats:
    event_datetime: "%{year}년 %{month_name} %{day}일 %{meridiem} %{hour}:%{minute} %{zone}"
    month_names:
      - 1월
      - 2월
      - 3월
      - 4월
      - 5월
      - 6월
      - 7월
      - 8월
      - 9월
      - 10월
      - 11월
      - 12월
    am: "오전"
    pm: "오후"
  order_confirmation:
    current_subject: "현재 HåfaPass 주문 내역 - %{event}"
    current_heading: "현재 주문 내역"
    reference: "주문 %{reference}"
    status_column: "상태"
    view_order: "주문 보기"
    seller_disclosure: "행사 판매자: %{seller}. %{operator}가 운영하는 티켓 서비스 %{service}는 주최자를 대신해 티켓을 판매하고 서비스 수수료를 받습니다."
    all_transferred: "이 주문의 모든 티켓이 양도되었습니다. 새 소지자는 본인 계정에서 티켓을 확인할 수 있습니다. %{tickets_link}에서 이 주문을 확인하세요."
    entry_instructions: "%{tickets_link}에서 티켓과 현재 상태를 확인하세요. 유효한 티켓만 입장에 사용할 수 있습니다."
    subject: "내 HåfaPass 티켓 - %{event}"
    title: "주문 확정"
    heading: "티켓 구매가 확정되었습니다!"
    thanks: "%{name}님, 구매해 주셔서 감사합니다."
    summary: "주문 내역"
    subtotal: "소계: %{amount}"
    discount: "할인: -%{amount}"
    service_fee: "서비스 수수료: %{amount}"
    total: "합계: %{amount}"
    tickets_heading: "내 티켓"
    type_column: "유형"
    attendee_column: "참석자"
    ticket_column: "티켓"
    view_ticket: "티켓 보기"
  pdf_note:
    capped: "처음 %{count}장의 티켓을 PDF로 첨부했습니다. 입장할 때 인터넷 연결 없이 열 수 있습니다. 나머지 티켓은 %{tickets_link}에서 확인하세요."
    partial: "총 %{total}장 중 %{count}장을 PDF로 첨부했습니다. 나머지 티켓은 현재 입장에 사용할 수 없습니다. %{tickets_link}에서 상태를 확인하세요."
    single: "티켓이 PDF로도 첨부되어 있어 인터넷 연결 없이도 입장 시 확인할 수 있습니다."
    all: "티켓 %{count}장 모두 PDF로도 첨부되어 있어 인터넷 연결 없이도 입장 시 확인할 수 있습니다."
  ticket:
    subject: "내 티켓 - %{event}"
    heading: "내 티켓"
    view: "내 티켓 보기"
    entry_instructions: "입장 시 QR Code를 제시해 주세요."
  event_cancelled:
    holder_body: "양도받은 티켓은 더 이상 사용할 수 없습니다. 환불은 티켓을 구매한 분에게 돌아갑니다."
    subject: "이벤트 취소: %{event}"
    heading: "%{event}가 취소되었습니다"
    body: "서비스 수수료를 포함한 결제 금액 전액의 자동 환불을 준비하고 있습니다. 별도 신청은 필요하지 않습니다. 현금 구매자는 수동 환불 안내를 받게 됩니다."
    view_order: "주문 보기"
  refund:
    late_capture_subject: "%{amount} 결제 금액을 환불했습니다 - %{event}"
    late_capture_heading: "결제 금액을 환불했습니다"
    late_capture_body: "결제가 완료되기 전에 %{event} 티켓 보류 시간이 만료되어 티켓이 해제되었으며 주문은 접수되지 않았습니다. 결제 금액 %{amount}을 전액 환불했습니다. 남은 티켓이 있으면 다시 구매할 수 있습니다."
    returned: "%{amount} 환불은 은행이나 카드사에 따라 보통 영업일 기준 5~10일 내에 결제에 사용한 카드에 반영됩니다."
    returned_cash: "주최자가 %{amount}의 현금 반환을 기록했습니다. 문의 사항은 주최자에게 연락해 주세요."
    returned_door_card: "주최자가 %{amount}의 카드 환불을 기록했습니다. 카드 반영 시점은 주최자에게 문의해 주세요."
    cancelled_subject: "이벤트 취소 — %{amount} 환불 진행 중"
    cancelled_heading: "이벤트 취소 — 환불 진행 중"
    cancelled_body: "%{event}가 취소되었습니다. 서비스 수수료를 포함한 %{amount} 환불이 진행 중입니다."
    subject: "환불 처리 완료 - %{event}"
    heading: "환불 처리 완료"
    body: "%{event} 티켓의 환불이 처리되었습니다."
    full: "전액 환불"
    partial: "부분 환불 (%{amount})"
    reason: "사유:"
    questions: "궁금한 점이 있으시면 행사 주최자에게 문의해 주세요."
  transfer:
    subject: "티켓 양도: %{event}"
    title: "티켓 양도"
    heading: "HåfaPass 티켓이 도착했습니다"
    accept: "티켓 수락"
    sign_in: "%{email} 주소로 로그인해 주세요. 이 링크는 %{expires_at}에 만료됩니다."
  waitlist:
    subject: "티켓 구매 가능 - %{event}"
    title: "티켓 구매 가능"
    heading: "티켓을 구매할 수 있습니다!"
    greeting: "%{name}님, 반가운 소식을 전해 드립니다! 이제 다음 행사의 티켓을 구매하실 수 있습니다:"
    greeting_anonymous: "안녕하세요, 반가운 소식을 전해 드립니다! 이제 다음 행사의 티켓을 구매하실 수 있습니다:"
    deadline: "24시간 이내에 티켓을 구매해 주세요. 이후에는 구매 기회가 만료됩니다."
    cta: "티켓 구매하기"
  waitlist_offer:
    subject: "대기자 구매 안내: %{event}"
    title: "대기자 구매 안내"
    heading: "티켓이 준비되었습니다"
    body: "%{event}의 %{ticket_type} 티켓 %{count}장이 고객님을 위해 확보되었습니다."
    cta: "티켓 받기"
    expires: "이 구매 기회는 %{expires_at}에 만료됩니다."
  ticket_status:
    issued: "발행됨"
    checked_in: "입장 완료"
    cancelled: "취소됨"
    transferred: "양도됨"
