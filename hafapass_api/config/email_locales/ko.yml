      - 2월
      - 3월
      - 4월
      - 5월
      - 6월
      - 7월
      - 8월
      - 9월
      - 10월
      - 11월
      - 12월
    am: "오전"
    pm: "오후"
  order_confirmation:
    subject: "내 HåfaPass 티켓 - %{event}"
    title: "주문 확정"
    heading: "티켓 구매가 확정되었습니다!"
    thanks: "%{name}님, 구매해 주셔서 감사합니다."
    summary: "주문 내역"
    subtotal: "소계: %{amount}"
    discount: "할인: -%{amount}"
    service_fee: "서비스 수수료: %{amount}"
