    deadline: "24시간 이내에 티켓을 구매해 주세요. 이후에는 구매 기회가 만료됩니다."
    cta: "티켓 구매하기"
  waitlist_offer:
    subject: "대기자 구매 안내: %{event}"
    title: "대기자 구매 안내"
    heading: "티켓이 준비되었습니다"
    body: "%{event}의 %{ticket_type} 티켓 %{count}장이 고객님을 위해 확보되었습니다."
    cta: "티켓 받기"
    expires: "이 구매 기회는 %{expires_at}에 만료됩니다."
