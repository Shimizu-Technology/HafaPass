    single: "Nakalakip din ang iyong tiket bilang PDF, kaya mabubuksan mo ito sa
      pasukan kahit walang signal."
    all: "Nakalakip din ang lahat ng %{count} tiket bilang mga PDF, kaya mabubuksan
      mo ang mga ito sa pasukan kahit walang signal."
    capped: "Nakalakip ang unang %{count} tiket bilang mga PDF, kaya mabubuksan mo
      ang mga ito sa pasukan kahit walang signal. Buksan ang natitira sa Mga
