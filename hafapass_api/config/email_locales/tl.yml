      - Enero
      - Pebrero
      - Marso
      - Abril
      - Mayo
      - Hunyo
      - Hulyo
      - Agosto
      - Setyembre
      - Oktubre
      - Nobyembre
      - Disyembre
    am: "AM"
    pm: "PM"
  order_confirmation:
    subject: "Ang Iyong mga Tiket sa HåfaPass - %{event}"
    title: "Kumpirmado na ang Order"
    heading: "Kumpirmado na ang iyong mga tiket!"
    thanks: "Salamat sa iyong pagbili, %{name}."
    summary: "Buod ng Order"
    subtotal: "Subtotal: %{amount}"
    discount: "Diskuwento: -%{amount}"
    service_fee: "Bayad sa Serbisyo: %{amount}"
    total: "Kabuuan: %{amount}"
    tickets_heading: "Ang Iyong mga Tiket"
