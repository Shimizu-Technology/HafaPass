    deadline: "チケットの購入期限は24時間です。期限を過ぎると確保された枠は無効になります。"
    cta: "チケットを購入"
  waitlist_offer:
    subject: "キャンセル待ちチケットのご案内：%{event}"
    title: "キャンセル待ちチケットのご案内"
    heading: "チケットをご用意できました"
    body: "%{event}の%{ticket_type}チケットを、お客様用に%{count}枚確保しています。"
    cta: "チケットを確保する"
    expires: "このご案内の有効期限は%{expires_at}です。"
