# Buyer email copy in English (the source language). The other files in this
# directory are generated from this one by the `gt` CLI; see docs/TRANSLATIONS.md.
# Keep %{placeholders} unchanged. Text only: links and formatting are added by
# EmailService, and every value is HTML-escaped.
emails:
  footer: "提供：HåfaPass · Shimizu Technology"
  my_tickets: "マイチケット"
  formats:
    event_datetime: "%{year}年%{month_name}%{day}日 %{meridiem}%{hour}:%{minute}"
    month_names:
      - 1月
      - 2月
      - 3月
      - 4月
      - 5月
      - 6月
      - 7月
      - 8月
      - 9月
      - 10月
      - 11月
      - 12月
    am: "午前"
    pm: "午後"
  order_confirmation:
    subject: "HåfaPassチケットのご案内 - %{event}"
    title: "ご注文確定"
    heading: "チケットのご購入が確定しました！"
    thanks: "%{name}様、ご購入ありがとうございます。"
    summary: "ご注文内容"
    subtotal: "小計：%{amount}"
    discount: "割引：-%{amount}"
    service_fee: "サービス手数料：%{amount}"
    total: "合計：%{amount}"
    tickets_heading: "お持ちのチケット"
    type_column: "種類"
    attendee_column: "来場者"
    ticket_column: "チケット"
    view_ticket: "チケットを表示"
