    entry_instructions: "入場時に受付でQR Codeをご提示ください。チケットは%{my_tickets_link}からいつでも確認できます。"
  pdf_note:
    single: "チケットはPDFでも添付していますので、入場時に通信環境がなくても表示できます。"
    all: "全%{count}枚のチケットをPDFでも添付していますので、入場時に通信環境がなくても表示できます。"
    capped: "最初の%{count}枚のチケットをPDFで添付していますので、入場時に通信環境がなくても表示できます。残りのチケットはマイチケットからご確\
      認ください。"
    partial: "全%{total}枚のうち%{count}枚のチケットをPDFで添付していますので、入場時に通信環境がなくても表示できます。残りのチケット\
      は現在入場に使用できません。マイチケットで状態をご確認ください。"
  ticket:
    subject: "お持ちのチケット - %{event}"
    heading: "お持ちのチケット"
    view: "お持ちのチケットを表示"
    entry_instructions: "入場時に受付でQR Codeをご提示ください。"
  refund:
    subject: "返金処理完了 - %{event}"
    heading: "返金処理完了"
    body: "%{event}の返金処理が完了しました。"
    full: "全額返金"
    partial: "一部返金（%{amount}）"
    returned: "ご購入時のお支払い方法に、5〜10営業日以内に%{amount}が返金されます。"
    reason: "理由："
    questions: "ご不明な点は、イベント主催者までお問い合わせください。"
  transfer:
    subject: "チケットの譲渡：%{event}"
    title: "チケットの譲渡"
    heading: "HåfaPassのチケットが届きました"
    accept: "チケットを受け取る"
    sign_in: "%{email}でログインしてください。このリンクの有効期限は%{expires_at}です。"
  waitlist:
    subject: "チケット購入のご案内 - %{event}"
    title: "チケット購入のご案内"
    heading: "チケットをご購入いただけます！"
