    single: "您的门票也已随附 PDF 版本，入场时即使没有信号也能打开。"
    all: "全部 %{count} 张门票也已随附 PDF 版本，入场时即使没有信号也能打开。"
    capped: "前 %{count} 张门票已随附 PDF 版本，入场时即使没有信号也能打开。其余门票请前往“我的门票”查看。"
    partial: "您的 %{total} 张门票中，有 %{count} 张已随附 PDF
