# Buyer email copy in English (the source language). The other files in this
# directory are generated from this one by the `gt` CLI; see docs/TRANSLATIONS.md.
# Keep %{placeholders} unchanged. Text only: links and formatting are added by
# EmailService, and every value is HTML-escaped.
emails:
