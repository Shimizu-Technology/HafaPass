  ticket:
    subject: "您的门票 - %{event}"
    heading: "您的门票"
    view: "查看您的门票"
    entry_instructions: "入场时请出示您的 QR Code。"
  refund:
    subject: "退款已处理 - %{event}"
    heading: "退款已处理"
    body: "您购买 %{event} 门票的退款已处理。"
    full: "全额退款"
    partial: "部分退款（%{amount}）"
    returned: "%{amount} 将在 5-10 个工作日内按原支付方式退回。"
    reason: "原因："
    questions: "如有任何疑问，请联系活动主办方。"
  transfer:
    subject: "门票转让：%{event}"
    title: "门票转让"
    heading: "有人向您转让了一张 HåfaPass 门票"
