  my_tickets: "我的门票"
  formats:
    event_datetime: "%{year}年%{month_name}%{day}日 %{meridiem}%{hour}:%{minute}"
    month_names:
      - 一月
      - 二月
      - 三月
      - 四月
      - 五月
      - 六月
      - 七月
      - 八月
      - 九月
      - 十月
      - 十一月
      - 十二月
    am: "上午"
    pm: "下午"
  order_confirmation:
    subject: "您的 HåfaPass 门票 - %{event}"
    title: "订单已确认"
    heading: "您的门票已确认！"
    thanks: "%{name}，感谢您的购买。"
    summary: "订单摘要"
    subtotal: "小计：%{amount}"
    discount: "优惠：-%{amount}"
    service_fee: "服务费：%{amount}"
    total: "合计：%{amount}"
    tickets_heading: "您的门票"
    type_column: "类型"
    attendee_column: "入场人"
    ticket_column: "门票"
    view_ticket: "查看门票"
