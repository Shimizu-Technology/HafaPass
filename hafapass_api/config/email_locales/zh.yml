    cta: "购买门票"
  waitlist_offer:
    subject: "您的候补购票资格：%{event}"
    title: "候补购票资格"
    heading: "已为您预留门票"
    body: "已为您预留 %{event} 的 %{ticket_type} 门票，共 %{count} 张。"
    cta: "领取门票"
    expires: "此购票资格将于 %{expires_at} 失效。"
