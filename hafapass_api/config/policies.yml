version: "2026-10-22"
status: approved
effective_date: "2026-10-22"
# Outstanding legal-review items. Not served publicly and not part of any
# digest: they are shown to admins in the policy register as information.
# Keep docs/POLICY_REVIEW_REGISTER.md in step with this list.
review_notes:
  buyer-terms:
    - section: Who we are and who sells your ticket
      note: Counsel to confirm seller responsibility and that payment to the agent fully discharges the buyer.
    - section: Limits on our responsibility
      note: Lawyer to confirm limitation wording and any consumer-law carve-outs.
    - section: Governing law and disputes
      note: Counsel to confirm Guam governing law, court venue, informal resolution wording, and enforceability for visiting buyers; decide whether arbitration is appropriate. No arbitration clause is proposed.
    - section: Transfers and resale
      note: Counsel to check Guam and federal ticket resale and anti-bot rules; the app supports transfers, not an authorized resale marketplace.
    - section: Refunds, cancellations, and event changes
      note: Counsel to set the buyer remedy and any deadline for cancellation, postponement and material changes; card cancellation refunds now start automatically, while cash and non-Stripe door-card returns need manual action.
  privacy:
    - section: Information we collect
      note: Counsel to confirm TIN collection, encryption, audited admin disclosure, tax-authority sharing, retention and breach response.
    - section: How long we keep it
      note: Counsel and CPA to approve retention periods and a deletion/legal-hold procedure. The 13-month analytics purge is implemented; a seven-year financial-record purge is not.
    - section: Service providers
      note: Privacy counsel to review General Translation text transfers, vendor contracts and cross-border processing, including Japan APPI, Korea PIPA and any EU targeting.
    - section: Your choices and rights
      note: Counsel to distinguish legal rights from voluntary requests and review marketing email consent, CAN-SPAM unsubscribe and organizer campaign controls. Checkout consent and one-click unsubscribe are implemented.
  organizer-agreement:
    - section: Our role as your limited agent
      note: Counsel to confirm agent-of-payee appointment and buyer discharge, check disbursements under FinCEN FIN-2014-R009 and Guam 11 GCA Ch. 109, fund custody, withholding and offsets, and whether licensing or segregated accounts are required.
    - section: Tax information
      note: Accountant to confirm fee-only BPT treatment and current rate, organizer gross receipts, 1099 form and filer, backup withholding, Guam reporting, and electronic substitute W-9 certification and retention. Product collection is not TIN matching or a filed return.
    - section: Chargebacks and negative balances
      note: Lawyer to confirm payment terms and dispute-fee allocation.
    - section: Buyer information
      note: Counsel to settle HåfaPass and organizer data roles, permitted event messages, independent marketing, incident notice and a data-processing addendum if needed.
    - section: Your responsibility for the event
      note: Counsel to set organizer license, permit, alcohol, insurance and accessibility warranties, and decide when proof is required.
    - section: Indemnity and limitation of liability
      note: Lawyer to confirm indemnity and the 12-month fee liability cap.
    - section: Governing law and changes
      note: Lawyer to confirm governing law and venue.
  retention:
    - section: Financial, order, and audit records
      note: Counsel and CPA to set a retention schedule and legal-hold process; the product does not automatically purge these records after seven years.
    - section: Scanner devices
      note: Counsel and operations to approve an enforced scanner-data deletion and lost-device procedure; current wording is an organizer instruction.
  cookies:
    - section: Payment and error monitoring
      note: Privacy counsel to review current Clerk, Stripe and Sentry SDK storage/cookie inventory and whether consent controls are required for any nonessential activity.
  accessibility:
    - section: What we support
      note: Accessibility reviewer to test actual keyboard and assistive technology journeys before making a broad conformance claim.
documents:
  buyer-terms:
    title: Buyer Terms
    summary: |-
      The terms that apply when you buy, receive, use, or transfer tickets on {{platform_name}}, including who sells the ticket, how pricing and fees work, and what to do when something goes wrong.
    sections:
      - heading: Who we are and who sells your ticket
        body: |-
          {{platform_name}} is a ticketing service run by {{operator_name}}. These terms are an agreement between you and {{operator_name}}.

          The event organizer is the seller of your ticket. The organizer appoints {{operator_name}}, operating {{platform_name}}, as its limited agent solely to accept buyer payments for its tickets. Your payment to {{platform_name}} is payment to the organizer and fully discharges your payment obligation for the ticket. The organizer is responsible for the event and your ticket contract; {{operator_name}} is not a party to that ticket contract.

          {{platform_name}} sells its own ticketing service separately and charges a service fee for it. Your receipt and ticket show both roles, for example "Sold by Island Nights · Tickets by {{platform_name}}".
      - heading: Prices and the service fee
        body: |-
          The price we advertise for a ticket is the total you will pay for it, including the mandatory service fee. The checkout total matches the advertised price. If a government tax is ever charged, or you choose an optional add-on such as merchandise or a donation, we show that amount separately before you pay.

          The service fee pays for the ticketing service: online sales, payment handling, ticket delivery, transfers, entry scanning, and buyer support. It is not a tax. The current fee schedule is {{fee_schedule}}. Each organizer decides whether buyers pay the fee, the organizer absorbs it, or the two share it. Either way, the total you see is the total you pay.
      - heading: Checkout and ticket issuance
        body: |-
          When you start checkout, we hold the selected tickets for about 10 minutes. If you don't finish in time, the hold ends and the tickets may go to someone else.

          Your order is complete only after payment is confirmed, or after a free or approved order is completed. We then send your tickets by email and make them available in your account. If you checked out as a guest, your confirmation email includes a private link to your order. Keep that email.

          You can download a receipt from your order page after the order is completed. We may cancel an order, with a refund of what you paid, if a price or listing error was obvious, if payment fails or is reversed, or if we reasonably suspect fraud or a breach of these terms.
      - heading: Using your ticket
        body: |-
          Each ticket has a QR code or entry code. One ticket admits one person, once. Treat the code like cash: anyone who presents it first may be admitted, and we can't always replace a code that someone else has used.

          Venue staff may refuse a ticket that has been cancelled, refunded, transferred away, disputed, already used, or otherwise made invalid. The organizer may also check ID, enforce age limits, or refuse entry under its own venue rules.
      - heading: Transfers and resale
        body: |-
          If the organizer has enabled transfers for an event, you can invite someone else to take an unused ticket through {{platform_name}} before the event starts. The recipient must accept the invitation with the verified email address that received it. Once accepted, your old entry code stops working. A pending invitation can expire or be cancelled.

          Transfers do not make {{platform_name}} a resale marketplace or guarantee a private resale. Follow any organizer resale restrictions and applicable law. You may not use bots, scripts, multiple accounts, or other tools to get around purchase limits, holds, or queues, or buy tickets for speculative resale. We may cancel tickets obtained through abuse, subject to applicable law.
      - heading: Refunds, cancellations, and event changes
        body: |-
          Refunds follow our Refund & Cancellation Policy and the refund rules the organizer shows on the event page. If an event is cancelled, we start eligible card refunds, including the service fee, without a request. The organizer returns cash payments manually; a non-Stripe door-card return also needs manual processing. If an event is postponed, your ticket remains valid while the organizer sets a new date, and you can request a refund. Contact us about another material change so we can review the remedy with the organizer.

          Event details such as performers, start times, and seating may change. The organizer decides on changes and is responsible for them. We pass on the notices organizers send through {{platform_name}}.
      - heading: The event itself
        body: |-
          The organizer is responsible for the event: its content, venue, schedule, safety, security, accessibility, age rules, and whether it happens as advertised. {{platform_name}} does not run events and is not responsible for what happens at them.

          By attending, you agree to follow the organizer's and venue's rules. Those rules may include bag checks, prohibited items, and conduct requirements. The organizer may remove you, without a refund, for breaking them.
      - heading: Events beyond anyone's control
        body: |-
          A typhoon, public-health order, government action, venue closure, or similar event may force an organizer to postpone or cancel an event. The organizer must tell buyers what changed. Our Refund & Cancellation Policy and any rights you cannot waive still apply; this section does not take away an eligible refund.
      - heading: Your account
        body: |-
          You can sign in to {{platform_name}} using our sign-in provider, or buy as a guest. Keep your sign-in details and order links private. You are responsible for activity on your account, so tell us promptly if you think someone else has used it.

          Give accurate contact details. We use them to deliver tickets and tell you about changes to events you've bought tickets for.

          The service is for buyers who are at least 13. If you are under 18, use it with a parent or guardian. A parent or guardian may buy a ticket for a child, subject to the event's age rules.
      - heading: Payment disputes
        body: |-
          If a charge looks wrong, please contact us first. We can usually fix an incorrect order faster than a bank can.

          If you file a chargeback or payment dispute with your bank, the tickets on that order are suspended while the dispute is open and may be cancelled if the dispute is decided in your favor.
      - heading: Limits on our responsibility
        body: |-
          To the extent the law allows, {{operator_name}} is not liable for indirect or consequential losses, such as travel or accommodation costs, or for losses caused by the event, the organizer, or the venue. Where we are liable, our total liability for an order is limited to the amount you paid for that order.

          Nothing in these terms limits rights you have under consumer protection laws that cannot be waived.
      - heading: Governing law and disputes
        body: |-
          These terms are governed by the laws of Guam, subject to consumer rights that cannot be waived. If you have a complaint, contact us so we can try to resolve it. If a court case is needed, the parties may bring it in the Superior Court of Guam, or another court with jurisdiction in Guam, subject to any mandatory law that applies to you.
      - heading: Changes and contact
        body: |-
          We may update these terms. The version you accepted at checkout applies to that order, and we record which version that was.

          For questions about an order, contact us {{support_contact}}.
  refunds:
    title: Refund & Cancellation Policy
    summary: |-
      When you can get a refund, what is refunded (including the service fee), how event cancellations and postponements are handled, and how long refunds take.
    sections:
      - heading: Who sets the refund rules
        body: |-
          Each event's organizer sets its refund rules, and they are shown on the event page before you buy. Refunds are paid from the organizer's event proceeds.

          If an event page doesn't state a refund policy, tickets are not refundable except when the event is cancelled, when it is postponed or materially changed, or where the law requires a refund.
      - heading: If an event is cancelled
        body: |-
          If an event is cancelled and not rescheduled, you are entitled to a full refund of everything you paid for your tickets, including the service fee. You don't need to ask for a Stripe card refund; we start it when the event is cancelled, and it goes back to the original card. For cash purchases, the organizer must return your cash and record the refund. Non-Stripe door-card payments also need a manual return through their provider. Disputed payments need separate resolution before we can refund them. We hold organizer payouts while buyer refunds remain unresolved.
      - heading: If an event is postponed or materially changed
        body: |-
          If an event is postponed, your ticket stays valid while the organizer sets a new date. You can request a refund for an unused ticket from your order page or contact us. If the event is rescheduled, check the new event details before attending.

          If the event changes materially in another way, such as a different venue or headline act, contact us with your order number. We will review the change with the organizer and applicable law. Check the event notice and your order page for any refund option or deadline; contact us if either is unclear.
      - heading: Refunding part of an order
        body: |-
          Where the event's rules allow it, you may be able to refund some tickets in an order and keep the rest. A partial refund returns the ticket price and the service fee charged on each ticket refunded. The service fee is refunded with the ticket it was charged on.
      - heading: Tickets that can't be refunded
        body: |-
          For an ordinary refund request, a ticket can't be refunded if it has already been used for entry, transferred to someone else, or refunded already. An open payment dispute must be resolved before we can issue a separate refund. These limits do not remove a refund required by law or the cancellation remedy above.
      - heading: How and when you receive the money
        body: |-
          Stripe card refunds go back to the original card. Once our payment provider confirms a refund, it usually appears within 5 to 10 business days, depending on your bank or card issuer. For non-Stripe card payments at the door, the organizer handles the return through its card provider and records it. For tickets paid for in cash at the door, the organizer handles the physical cash return; {{platform_name}} may record that return but does not transfer the cash. Free tickets have no payment to return; cancelling one releases the seat.

          If a refund attempt fails or its status is unclear, we confirm the result with our payment provider before trying again, so you are not refunded twice or left out.
      - heading: Chargebacks
        body: |-
          Please contact us before disputing a charge with your bank. Filing a chargeback suspends the tickets on the order while the dispute is open.
      - heading: How to ask for a refund
        body: |-
          Use the order page in your account or the link in your confirmation email, or contact us {{support_contact}} with your order number. Refund requests are subject to the event's rules and this policy.
  privacy:
    title: Privacy Policy
    summary: |-
      What personal information {{platform_name}} collects, how we use and share it, how long we keep it, and the choices you have.
    sections:
      - heading: Who is responsible
        body: |-
          {{platform_name}} is run by {{operator_name}}, which is responsible for the personal information described here. Event organizers who receive your information for their events are separately responsible for how they use it.
      - heading: Information we collect
        body: |-
          Account and contact details: your name, email address, and phone number if you choose to give it.

          Orders and tickets: what you bought, attendee names, ticket transfers, refunds, and check-in or scan records at the door.

          Information organizers ask for: answers to registration questions and waivers you accept for an event.

          Activity on {{platform_name}}: favorites, follows, event reminders, support conversations, and how you arrived (for example, a referral code or campaign link).

          Technical and security data: IP address, device and browser information, security signals used to prevent fraud and abuse, and error diagnostics.

          Organizer tax information: legal and business names, federal tax classification, tax identification number (SSN or EIN), address, exemption details, and signed tax certification. We use this for payout and tax reporting duties and share it with tax authorities as legally required. Tax identification numbers are encrypted at rest, masked in normal screens, and accessible in full only through audited admin actions.

          We do not store your card number. Card details are entered into and handled by our payment processor, Stripe.
      - heading: How we use it
        body: |-
          We use your information to sell and deliver tickets, check you in, process refunds and transfers, and send you messages about your orders and events you've bought tickets for.

          We also use it to provide support, prevent fraud and abuse, keep accounting and tax records, meet legal obligations, fix errors, and understand in aggregate how people find events, for example which campaign or referral led to a sale.
      - heading: Sharing with organizers
        body: |-
          When you buy a ticket or register for an event, the organizer receives the information it needs to run that event: your name, email address, phone number if you gave one, attendee names, your answers to its questions, and check-in status. Organizers may use this information only for their own events and must follow the law and our Organizer Agreement. They are responsible for their own use of it.

          Authorized organizer owners, managers, and assigned box-office staff can export attendee information for their events. Staff with finance access alone can export transaction details without attendee names or contact details. Export files for large sales lists are kept in private storage for two days after they are prepared, then deleted. Smaller exports download directly and are not kept as export files by {{platform_name}}.
      - heading: Service providers
        body: |-
          We use these providers to run {{platform_name}}. The information each receives depends on the feature you use and may be processed outside Guam.

          Clerk, for sign-in and account authentication.

          Stripe, for payment processing and fraud prevention.

          Resend, for email delivery.

          Amazon Web Services (S3), for file storage such as event images and ticket PDFs.

          Sentry, for error monitoring.

          Render and Netlify, for application hosting, and Neon, for database hosting.

          General Translation, to translate organizer event content into other languages when automatic translation is enabled. Event titles, descriptions and other text selected for translation may be sent to it; do not put sensitive attendee information in event copy.

          Apple Wallet and Google Wallet, only when you choose to add a ticket to your wallet.

          We may also disclose information when the law requires it, to protect people's safety, or as part of a sale or reorganization of our business.
      - heading: What we don't do
        body: |-
          We do not sell your personal information. We do not use third-party advertising cookies or let advertising networks track you on {{platform_name}}. See our Cookie Notice for details.
      - heading: How long we keep it
        body: |-
          We retain order, payment, refund, payout, tax and audit records for accounting, tax, dispute and legal needs. We have not set an automatic deletion date for these records. Marketplace analytics not tied to an order are deleted after 13 months. Our Data Retention Schedule has more detail.
      - heading: Your choices and rights
        body: |-
          You can ask to access, correct, export, or delete your personal information by contacting us {{support_contact}}. We will verify your identity and assess the request under applicable law and our recordkeeping duties. Some records, such as completed orders, may need to be kept for legal, tax, or dispute reasons.

          We send organizer marketing emails only when you choose to receive them at checkout. Your choice applies to that organizer across its events until you unsubscribe or change it at a later checkout. Leaving the box unchecked at a later checkout withdraws your earlier choice. Each marketing email has a one-click unsubscribe link, and we honor your request immediately. Order confirmations, tickets, transfers, refunds and event changes are service messages and will still be sent.
      - heading: Security and breach notification
        body: |-
          We limit staff access to personal information by role, record sensitive actions, and encrypt data in transit. No system is perfectly secure.

          If we discover a security incident, we will assess what information was involved and give any notices required by Guam's breach notification law (9 GCA Chapter 48, Notification of Breaches of Personal Information) or other applicable law.
      - heading: Children
        body: |-
          {{platform_name}} is not directed to children under 13. People under 13 should not create an account or place an order. A parent or guardian may buy tickets for a child and provide an attendee name where needed. If you believe a child under 13 gave us personal information directly, contact us so we can investigate and take appropriate action.
      - heading: Changes and contact
        body: |-
          We will post changes to this policy here and update the version shown. For privacy questions or requests, contact us {{support_contact}}.
  organizer-agreement:
    title: Organizer Agreement
    summary: |-
      The agreement between event organizers and {{operator_name}} for selling tickets on {{platform_name}}, covering the agency appointment, fees, payouts, refunds, responsibilities, and termination. You must accept the current version before publishing an event.
    sections:
      - heading: Eligibility and authority
        body: |-
          This agreement is between you, the organizer, and {{operator_name}}, which runs {{platform_name}}. You must be at least 18 and able to enter contracts. If you act for a business or group, you confirm that you have authority to bind it.

          You confirm that you have the right to hold and sell tickets to each event you list, including any permission you need from the venue, performers, or rights holders.
      - heading: Accurate listings
        body: |-
          Event listings must be accurate and kept current, including the local date and time, venue, ticket types and quantities, all-in prices, age rules, accessibility information, and refund policy. If you don't state a refund policy, tickets are refundable for cancellation or postponement, for another material change where we or the law determine a refund is due, or where the law otherwise requires.

          You are responsible for the content you publish, including images and descriptions.
      - heading: Our role as your limited agent
        body: |-
          You are the seller of the tickets to your event. You appoint {{operator_name}}, operating {{platform_name}}, as your limited agent solely to accept buyer payments for your tickets. A buyer's payment to {{platform_name}} is payment to you and fully discharges the buyer's payment obligation to you. Your ticket contract is between you and the buyer; {{operator_name}} is not a party to it.

          {{operator_name}} sells its ticketing service to buyers and to you, and charges the service fee for that service. Receipts and tickets will name you as the seller ("Sold by" followed by your organizer name, then "Tickets by {{platform_name}}").

          Buyer card payments are processed through {{operator_name}}'s payment account and received into its business account. We hold collected ticket proceeds for you and record them separately from our service fees. After the event, we pay you by check or the other payout method on file, net of service fees, refunds, chargebacks, and adjustments. We may withhold or offset amounts for refunds, chargebacks, cancelled or postponed events, and suspected fraud. You remain responsible for refunds beyond the funds we hold, including after a payout.
      - heading: Service fees
        body: |-
          The current service fee is {{fee_schedule}}.

          For each event you choose how the fee is handled: buyers pay it on top of the ticket price, you absorb it so buyers pay only the ticket price, or you split it and buyers pay a set share. Advertised prices always show the buyer's full total.

          We may change the fee schedule. You must accept the current agreement before publishing a new event. The fee shown to a buyer before payment applies to that order; a later fee change does not change a completed order. Check the current fee terms before selling more tickets, including for an event already published.
      - heading: Payouts
        body: |-
          We pay your available balance {{payout_schedule}}, after we reconcile the event's sales, refunds, and disputes and receive required tax information. Payouts are made by check from {{operator_name}}'s business account unless a different payout method is approved and recorded for you.

          Your available balance is your ticket proceeds minus any service fees you absorb, refunds, chargebacks, adjustments, amounts held for open disputes, and amounts already paid to you.

          We may delay or hold some or all of a payout while refunds or disputes are open, if an event is cancelled or changed, or during a documented risk or compliance review. We will give you a reason and review the hold when the underlying issue is resolved. A hold does not remove your responsibility for refunds or chargebacks.
      - heading: Tax information
        body: |-
          Before any paid payout, you must provide accurate tax information, a completed W-9 or other form we require for your status, and accurate payee details. You must update them when they change. We may request corrections or pause a payout while required tax details are missing. We will arrange any legally required withholding or information reporting through a separate reviewed process. The tax reports in {{platform_name}} are preparation tools; they are not filed returns.

          You are responsible for determining and paying taxes on your ticket sales, including any Guam Business Privilege Tax or event-specific levy that applies to you. {{operator_name}} is responsible for its own taxes on ticketing revenue. The service fee is not a government tax, and you must not describe it as one.
      - heading: Refunds, cancellations, and postponements
        body: |-
          Refunds are funded from your event proceeds. You agree to honor your stated refund policy and our Refund & Cancellation Policy.

          If you cancel an event, tell us promptly and notify buyers through {{platform_name}}. Cancellation starts eligible Stripe card refunds, including service fees, without a buyer request. You must return cash purchases and record the returns; non-Stripe door-card payments also need manual returns through their provider. We hold your payout while buyer refunds remain unresolved. If you postpone an event, notify buyers and cooperate with refund requests for unused tickets. If you materially change an event in another way, promptly disclose the change and work with us on the remedy and any request window under applicable law.

          You must honor every valid ticket sold for your event.
      - heading: Events beyond anyone's control
        body: |-
          A typhoon, public-health order, government action, venue closure, or comparable event outside reasonable control may delay performance. Tell us and buyers promptly, take reasonable steps to limit harm, and propose a lawful remedy. This does not excuse required refunds, chargebacks, amounts already owed, or duties that can still be performed.
      - heading: Chargebacks and negative balances
        body: |-
          If a buyer disputes a payment, we may hold the disputed amount from your balance and respond to the dispute using records you and we provide. If the dispute is lost, the ticket amount and any dispute fees charged to us come out of your proceeds.

          If refunds, disputes, or fees exceed your balance, the difference is a negative balance you owe us. We may deduct it from future payouts or invoice you, and you agree to pay invoices by the due date shown.
      - heading: Your responsibility for the event
        body: |-
          You are responsible for your event: the venue, permits, business and event licenses, staffing, security, safety and emergency planning, insurance, accessibility, age restrictions, venue rules, and compliance with all laws. If you serve or sell alcohol, use regulated goods, or run a raffle or gaming activity, you must hold the required approvals and follow applicable rules. We may ask for proof before allowing sales. You must provide accessible seating information where your event uses assigned seating.

          You may not list events or sell tickets that our Acceptable Use Policy prohibits.
      - heading: Buyer information
        body: |-
          Authorized owners, managers, and assigned box-office staff can export buyer and attendee information for your events. Finance-only staff can export transaction details without attendee personal information. Large sales export files are stored privately for two days after preparation, then deleted. You may use buyer and attendee information to run that event, provide customer service, and meet legal obligations. Organizer marketing through {{platform_name}} is limited to buyers who chose it at checkout and have not unsubscribed; each marketing email has a one-click unsubscribe link. If you conduct marketing outside {{platform_name}} using data you lawfully hold, you are responsible for any required consent, accurate sender details, an effective opt-out, and honoring opt-outs. Keep attendee data secure, do not sell it, and notify us promptly if it is lost, misused, or accessed without authority. You are independently responsible for your use of this information; we remain responsible for our own platform processing.
      - heading: Content license
        body: |-
          You keep ownership of the names, logos, images, and descriptions you upload. You grant {{operator_name}} a non-exclusive, royalty-free license to use them to list, promote, and sell tickets to your events on {{platform_name}} and in related marketing. You confirm you have the rights needed to grant this license.
      - heading: Indemnity and limitation of liability
        body: |-
          You will defend and indemnify {{operator_name}} against third-party claims, reasonable losses, and reasonable costs arising from your events, your content, your use of buyer information, or your breach of this agreement or the law, except to the extent caused by our own misconduct.

          To the extent the law allows, {{operator_name}} is not liable for indirect or consequential losses, and its total liability to you under this agreement is limited to the service fees it earned from your events in the 12 months before the claim.
      - heading: Suspension and termination
        body: |-
          We may pause ticket sales, hold payouts, remove a listing, or suspend your account if we reasonably believe you have broken this agreement or the law, or that buyers are at risk. Either party may end this agreement with notice. Obligations for tickets already sold, refunds, disputes, negative balances, and indemnity continue after it ends.
      - heading: Governing law and changes
        body: |-
          This agreement is governed by the laws of Guam. Either party may bring a dispute in the Superior Court of Guam, or another court with jurisdiction in Guam, after giving the other a reasonable chance to resolve it informally, unless urgent relief is needed.

          We may update this agreement. You must accept the current version before you publish a new event, and {{platform_name}} records which version you accepted and when. For questions, contact us {{support_contact}}.
  acceptable-use:
    title: Acceptable Use Policy
    summary: |-
      The events, content, and behavior that are not allowed on {{platform_name}}, and what we may do when the rules are broken.
    sections:
      - heading: Who this applies to
        body: |-
          This policy applies to everyone who uses {{platform_name}}: buyers, attendees, organizers, and their staff.
      - heading: Events that may not be listed
        body: |-
          Events that are illegal, or that promote or facilitate illegal activity.

          Events you don't have the right to sell, including tickets you don't hold or events you aren't authorized to run.

          Events involving hate, harassment, violence, or exploitation of anyone, including minors.

          Unlicensed gambling, raffles, or lotteries, and sales of regulated goods such as alcohol, tobacco, or firearms in breach of the law.

          Events designed to mislead, such as fake events, bait-and-switch listings, or misrepresented performers.

          Events that infringe others' intellectual property, or that involve sanctioned persons or places.
      - heading: Ticket and payment integrity
        body: |-
          Don't use bots, scripts, or multiple accounts to buy tickets or get around purchase limits, holds, or queues.

          Don't list speculative tickets you don't yet have, or duplicate, alter, or counterfeit tickets.

          Don't use stolen payment methods, test cards, or deliberate false chargebacks, and don't try to bypass refund, transfer, or check-in controls.
      - heading: Account and system security
        body: |-
          Don't access accounts, data, or admin tools you aren't authorized to use, collect other users' information, probe or overload our systems, or interfere with scanning at events.
      - heading: Content
        body: |-
          Content you post must be accurate and lawful, and must not be defamatory, obscene, or infringing.
      - heading: Enforcement
        body: |-
          If we reasonably believe this policy has been broken, we may investigate, preserve evidence, remove content or listings, cancel tickets, pause sales or payouts, suspend or close accounts, and cooperate with affected parties and authorities where the law allows. We may act faster where buyers or the service face immediate risk. Where appropriate, we will tell you what action we took and why, and you can contact support to contest an error.
      - heading: Reporting a problem
        body: |-
          To report a listing, ticket, or user that may break this policy, contact us {{support_contact}}.
  retention:
    title: Data Retention Schedule
    summary: |-
      How long {{platform_name}} keeps different kinds of records and what happens when you ask us to delete your information.
    sections:
      - heading: Financial, order, and audit records
        body: |-
          We keep orders, payments, refunds, payouts, tax records, disputes, admissions, and audit records for accounting, tax, legal, and dispute purposes. There is currently no automatic deletion date for these records. We will set a retention schedule after professional review; a legal hold or legal duty may require longer retention.
      - heading: Marketplace analytics
        body: |-
          Analytics events not tied to an order, such as page visits and campaign attribution, are deleted after 13 months. Attribution recorded on an order, such as a referral code, is kept with that order.
      - heading: Operational and support data
        body: |-
          Payment provider events, email delivery history, support notes, and security logs are kept only as long as needed for delivery, incident response, disputes, and abuse prevention.
      - heading: Organizer sales exports
        body: |-
          Large organizer sales exports are kept in private file storage for two days after preparation, then deleted. Smaller exports download directly and are not kept as export files by {{platform_name}}. The underlying order and attendee records have separate retention needs described above.
      - heading: Scanner devices
        body: |-
          Organizers should remove offline scanner data from their devices after the event and any needed reconciliation. Tell us promptly if a scanner device is lost or stolen so access can be revoked. We cannot erase data on an organizer's device remotely.
      - heading: Deletion requests and holds
        body: |-
          We review deletion requests and delete information where we can. Legal holds, open disputes, fraud investigations, and legal or tax duties may require us to retain records. We do not currently have an automated process that separates and deletes every other record when a request is made. To ask for deletion, contact us {{support_contact}}.
  cookies:
    title: Cookie Notice
    summary: |-
      The cookies and similar browser storage {{platform_name}} uses, why we use them, and how to control them. We don't use advertising or third-party tracking cookies.
    sections:
      - heading: What cookies are
        body: |-
          Cookies are small files a website stores in your browser. Websites also use similar tools, such as local storage. In this notice, "cookies" covers both.
      - heading: Cookies needed to run the service
        body: |-
          These cookies make {{platform_name}} work, and the service can't function properly without them. We use them to keep you signed in through our sign-in provider, Clerk; to hold your tickets and remember your order during checkout; to let you return to a guest order; to remember your language preference; to store event data on organizer devices so scanning works offline; and to protect the service through security checks and rate limiting.
      - heading: Payment and error monitoring
        body: |-
          Stripe may use cookies and similar storage in payment fields for payment and fraud prevention. When error monitoring is enabled, Sentry receives technical diagnostics and may use browser storage for tracing or session continuity. We do not intentionally send payment card details to Sentry.
      - heading: First-party analytics
        body: |-
          We measure how people find events, such as which campaign link or referral code led to a purchase. This information is collected by {{platform_name}} itself, saved with the order where there is one, and not shared with advertising networks.
      - heading: What we don't use
        body: |-
          We do not use advertising cookies, cross-site tracking, or third-party analytics that build profiles of you across websites.
      - heading: Controlling cookies
        body: |-
          You can block or delete cookies in your browser settings. If you block the cookies needed to run the service, sign-in, checkout, and some ticket features may not work.

          For questions, contact us {{support_contact}}.
  accessibility:
    title: Accessibility Statement
    summary: |-
      Our accessibility goals for {{platform_name}}, the known limitations, and how to get help or report a barrier.
    sections:
      - heading: Our goal
        body: |-
          We want everyone to be able to find events, buy tickets, and get in the door using {{platform_name}}. We aim to meet the Web Content Accessibility Guidelines (WCAG) 2.1 at Level AA, and to follow WCAG 2.2 where practical.
      - heading: What we support
        body: |-
          {{platform_name}} is designed for phones and desktop computers. We use keyboard controls, labels, and reduced-motion settings in many parts of the service. We have not completed an independent conformance audit of every checkout, organizer, scanner, and wallet flow.
      - heading: Known limitations
        body: |-
          Seat maps for events with assigned seating may be harder to use with a screen reader. If you have trouble choosing seats, contact us so we can work with you on an accessible way to buy tickets.

          Images and PDFs uploaded by organizers may not include text descriptions. We are working to improve this.
      - heading: Accessibility at events
        body: |-
          Each organizer is responsible for accessibility at its venue and event. Where the organizer provides it, accessibility information is shown on the event page. For events with assigned seating, organizers confirm whether accessible seating is available. For questions about a specific venue, contact the organizer or ask us to pass your question on.
      - heading: Get help or report a barrier
        body: |-
          If something on {{platform_name}} is hard to use, or you need help buying tickets, contact us {{support_contact}}. Tell us the page and what happened, and include the event name if you need tickets for a specific date.
