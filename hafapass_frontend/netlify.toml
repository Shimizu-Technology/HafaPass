# Effective Netlify configuration for the frontend. The repository-root
# netlify.toml sets build.base to this directory, so Netlify reads this file and
# resolves every path below relative to hafapass_frontend/.
[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Permissions-Policy = 'camera=(self), payment=(self "https://js.stripe.com"), microphone=(), geolocation=()'
    # Report-only: violations show in the browser console and block nothing.
    # Tighten (and enforce) once a release shows no unexpected reports.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://*.js.stripe.com https://clerk.hafapass.shimizu-technology.com https://*.clerk.accounts.dev https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.clerk.com https://hafapass-staging-assets-20261010-01a11d81.s3.ap-southeast-2.amazonaws.com https://*.stripe.com; font-src 'self' data:; connect-src 'self' https://hafapass-api.onrender.com https://api.stripe.com https://clerk.hafapass.shimizu-technology.com https://*.clerk.accounts.dev https://*.sentry.io; frame-src https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://challenges.cloudflare.com https://www.youtube-nocookie.com https://player.vimeo.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/events/*/preview"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# Vite fingerprints every file under /assets, so a URL never changes content.
# Stripe Elements loads the brand font files into its js.stripe.com iframe.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "https://js.stripe.com"

# Personal, account and staff pages: keep them out of search results and never
# send their URLs (which can carry ticket credentials or tokens) as a referrer.
# Each path is listed exactly; a section root and its subpaths are separate.
[[headers]]
  for = "/tickets/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

