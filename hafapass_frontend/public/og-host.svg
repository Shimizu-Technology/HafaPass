<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#032827"/>
      <stop offset="60%" style="stop-color:#0b6563"/>
      <stop offset="100%" style="stop-color:#032827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="110" r="220" fill="#20e0cc" opacity="0.07"/>

  <text x="100" y="150" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" fill="#91feeb">For event organizers on Guam</text>
  <text x="100" y="250" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="700" fill="#ffffff">Host your event</text>
  <text x="100" y="340" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="700" fill="#ffffff">with Håfa<tspan fill="#53f5df">Pass</tspan></text>
  <text x="100" y="420" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Sell tickets, scan at the door, get paid.</text>

  <g font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff">
    <rect x="100" y="480" width="220" height="52" rx="26" fill="#ffffff" fill-opacity="0.1"/>
    <text x="210" y="514" text-anchor="middle">No setup fees</text>
    <rect x="336" y="480" width="250" height="52" rx="26" fill="#ffffff" fill-opacity="0.1"/>
    <text x="461" y="514" text-anchor="middle">Free events free</text>
    <rect x="602" y="480" width="290" height="52" rx="26" fill="#ffffff" fill-opacity="0.1"/>
    <text x="747" y="514" text-anchor="middle">Door scan on any phone</text>
  </g>
  <rect x="0" y="620" width="1200" height="10" fill="#f0564a"/>
