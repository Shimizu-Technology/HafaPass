<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #f8fafb; color: #0f172a; }
      .boot-splash { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
      .boot-splash::before { content: ""; position: absolute; inset: 0 0 auto; height: 65px; background: var(--startup-header-color, #ffffff); }
      .boot-splash span { color: #0e7c7b; font: 700 2rem/1.2 system-ui, sans-serif; letter-spacing: -0.04em; }
    </style>
    <script>
      (function () {
        var url = new URL(window.location.href)
        var token = url.searchParams.get('preview_token')
        if (!token || !/^\/events\/[^/]+\/?$/.test(url.pathname)) return
        url.searchParams.delete('preview_token')
        url.pathname = url.pathname.replace(/\/$/, '') + '/preview'
        url.hash = 't=' + encodeURIComponent(token)
        window.location.replace(url.href)
      })()
    </script>
    <!-- Browser page translation stays available while buyer pages are only
         partly extracted into locale files. Phase 2 can restore translate="no"
         and <meta name="google" content="notranslate"> once HåfaPass
         translates every page itself (docs/TRANSLATIONS.md). -->
    <!-- stale-shell-recovery: a page cached before a deploy can request script
         files the new release no longer has. Reload once so the browser picks up
         the current release instead of staying blank. -->
    <script>
      (function () {
        var key = 'hafapass_stale_shell_reload_at'
        // Returns true only when a reload actually happens.
        function recover() {
          if (window.hafapassCanRecoverShell && !window.hafapassCanRecoverShell()) return false
          try {
            var last = Number(window.sessionStorage.getItem(key))
            if (last && Date.now() - last < 60000) return false
            window.sessionStorage.setItem(key, String(Date.now()))
          } catch (error) { return false }
          window.location.reload()
          return true
        }
        window.addEventListener('error', function (event) {
          var target = event.target
          var url = target && (target.src || target.href || '')
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK') && /\/assets\//.test(url)) recover()
        }, true)
        // Keep the original rejection when throttled so the app's error boundary sees it.
        window.addEventListener('vite:preloadError', function (event) { if (recover()) event.preventDefault() })
      })()
    </script>
    <!-- /stale-shell-recovery -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HåfaPass — Events and Tickets on Guam</title>
    <meta name="description" content="Discover events on Guam, buy tickets, and check in with your phone." />
    <meta name="keywords" content="Guam, events, tickets, nightlife, concerts, festivals, HåfaPass, HafaPass, Hafa Pass, island events, Guam entertainment" />

    <!-- Crawlable ticket mark; keep PWA/apple icons below. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />

    <!-- Open Graph. Per-page canonical and og:url tags come from components/SEO.jsx;
         a static copy here would give every page a second, conflicting canonical. -->
    <meta property="og:title" content="HåfaPass — Events and Tickets on Guam" />
    <meta property="og:description" content="Discover events on Guam, buy tickets, and check in with your phone." />
    <!-- public-site-url -->
    <meta property="og:image" content="%PUBLIC_WEB_URL%/og-default.jpg" data-rh="true" />
    <meta property="og:image:width" content="1200" data-rh="true" />
    <meta property="og:image:height" content="630" data-rh="true" />
    <!-- /public-site-url -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HåfaPass" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HåfaPass — Events and Tickets on Guam" />
    <meta name="twitter:description" content="Discover events on Guam, buy tickets, and check in with your phone." />
    <!-- public-site-url -->
    <meta name="twitter:image" content="%PUBLIC_WEB_URL%/og-default.jpg" data-rh="true" />
    <!-- /public-site-url -->

    <!-- Fonts are bundled with the app and use font-display: swap. -->

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Match Navbar before React loads; Navbar keeps this in sync on scroll.
      %HEADER_THEME_SCRIPT%
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Additional SEO & PWA -->
    <meta name="apple-mobile-web-app-title" content="HåfaPass" />
    <meta name="msapplication-TileColor" content="#0e7c7b" />

    <!-- Structured Data: absolute URLs come from VITE_PUBLIC_WEB_URL at build time. -->
    <!-- public-site-url -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "%PUBLIC_WEB_URL%/#organization",
          "name": "HåfaPass",
          "alternateName": ["HafaPass", "Hafa Pass"],
          "url": "%PUBLIC_WEB_URL%",
          "logo": "%PUBLIC_WEB_URL%/icons/icon-512.png"
        },
        {
          "@type": "WebSite",
          "@id": "%PUBLIC_WEB_URL%/#website",
          "name": "HåfaPass",
          "alternateName": ["HafaPass", "Hafa Pass"],
          "url": "%PUBLIC_WEB_URL%",
          "description": "Discover and purchase tickets for events across Guam",
          "publisher": { "@id": "%PUBLIC_WEB_URL%/#organization" }
        }
      ]
    }
    </script>
    <!-- /public-site-url -->
  </head>
  <body>
    <div id="root"><div class="boot-splash" role="status" aria-label="Loading HåfaPass"><span>HåfaPass</span></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
